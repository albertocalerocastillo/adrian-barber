<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sello de la portada: es lo más grande de la primera pantalla (LCP).
         Se pide ya, sin esperar a React. srcset/sizes = los del HeroComponent. -->
    <link
      rel="preload"
      as="image"
      href="/logo-sello.webp"
      imagesrcset="/logo-sello-400.webp 400w, /logo-sello-600.webp 600w, /logo-sello.webp 779w"
      imagesizes="(min-width: 1024px) 30rem, (min-width: 768px) 20rem, (min-width: 640px) 18rem, min(62vw, 17rem)"
      fetchpriority="high"
    />

    <!-- Verificación Google Search Console -->
    <meta name="google-site-verification" content="373ReQSUmSvZnA4ldRT71RsjVQjqNB9NlUkzl7gNmbM" />

    <!-- ═══════════════════════════════════════════
         SEO BÁSICO
    ════════════════════════════════════════════ -->

    <meta name="description" content="Barbería y peluquería en La Rinconada (Sevilla). Corte con cejas, barba y diseños desde 6 €, mechas y tinte. Pide cita por WhatsApp. ☎ 695 81 10 18" />
    <meta name="keywords" content="peluquería La Rinconada, barbería La Rinconada, barbero La Rinconada, peluquería Sevilla, San José de la Rinconada, Adrián Sánchez, corte de pelo, barba, diseños, mechas, tinte, cita barbería" />
    <meta name="author" content="Adrián Sánchez Aranda" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://adrian-barber.vercel.app/" />

    <!-- ═══════════════════════════════════════════

    <meta property="og:title" content="A.S Peluquería y Barbería — La Rinconada, Sevilla" />
    <meta property="og:description" content="Corte con cejas, barba y diseños desde 6 €, mechas y tinte, en La Rinconada (Sevilla). Pide cita por WhatsApp." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="A.S Barbería" />

    <meta name="twitter:image" content="https://adrian-barber.vercel.app/og-imagen.jpg" />

    <!-- Tipografías: van dentro de la web (src/main.jsx), no desde Google. -->

    <!-- ═══════════════════════════════════════════

         es una barbería local (mejora el posicionamiento
         en "barbería La Rinconada" y similares).
         ⚠️ Revisar el horario y añadir geo exacto (lat/lng)
            cuando Adrián los confirme.
    ════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",

      "url": "https://adrian-barber.vercel.app",
      "telephone": "+34695811018",

      "currenciesAccepted": "EUR",

      },
      "areaServed": "La Rinconada, Sevilla",

        {
          "@type": "OpeningHoursSpecification",

      ],
